<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <style>
    :root {
      color-scheme: light dark;
    }
    .bg {
      fill: #0a0a0a;
    }
    .mk {
      fill: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      .bg {
        fill: #fafafa;
      }
      .mk {
        fill: #0a0a0a;
      }
    }
  </style>
  <rect class="bg" width="16" height="16" rx="4" fill="#0a0a0a" />
  <g class="mk" fill="#fafafa">
    <rect x="1" y="4" width="14" height="2" />
    <rect x="1" y="7" width="2" height="4" />
    <rect x="4" y="7" width="2" height="4" />
    <rect x="7" y="7" width="2" height="4" />
    <rect x="10" y="7" width="2" height="4" />
    <rect x="13" y="7" width="2" height="4" />
  </g>
</svg>
