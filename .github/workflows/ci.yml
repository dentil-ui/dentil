name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the install test uses shadcn@latest and its app templates, which change without a commit here.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: registry.json is up to date
        run: git diff --exit-code registry.json || (echo "Run npm run registry:build and commit registry.json." && exit 1)

  install:
    name: Install into fresh Radix and Base UI apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/test-install.sh
